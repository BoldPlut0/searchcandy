[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchcandy"
version = "0.3.1"
license = {text = "MIT"}
description = "The Python client for TGM: exact passages from your own text and Markdown files, each with its file and version."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://searchcandy-labs.com"
Documentation = "https://searchcandy-labs.com/docs"
Source = "https://github.com/BoldPlut0/searchcandy"
Changelog = "https://github.com/BoldPlut0/searchcandy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["searchcandy*"]
